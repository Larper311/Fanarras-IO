 }
 dot=0};

 _u3(dt);
 for(const t of ents){
  if(!t||t.dead)continue;
  if(t.slowT>0){t.slowT-=dt;if(!t.sh){const f=Math.pow(.93,dt*60);t.vx*=f;t.vy*=f}if(R()<dt*5&&fx.length<300)fx.push({x:t.x+rr(-t.r,t.r),y:t.y+rr(-t.r,t.r),r:rr(3,6),col:'#9fe8ff',n:0,l:.4,m:.4,bu:1})}
  if(t.burnT>0){t.burnT-=dt;dot=1;hurt(t,t.burnD*dt,t.burnSrc);dot=0;if(R()<dt*8&&fx.length<300)fx.push({x:t.x+rr(-t.r,t.r),y:t.y+rr(-t.r,t.r),r:rr(3,7),col:'#ff9d3d',n:0,l:.35,m:.35,bu:1});if(t.dead)continue}
  if(!t.c||t.sh)continue;
  const o=t.c.o;
  t.abcd=Math.max(0,(t.abcd||0)-dt);if(t.bub>0){t.bub-=dt;if(R()<dt*14&&fx.length<300){const a=rr(0,TAU);fx.push({x:t.x+Math.cos(a)*t.r*1.3,y:t.y+Math.sin(a)*t.r*1.3,r:4,col:'#8fd3ff',n:0,l:.2,m:.2,bu:1})}}
